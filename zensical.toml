[project]
site_name = "go-galaxy"
site_description = "Fast Ansible Galaxy collections and roles installer for CI"
site_url = "https://greeddj.github.io/go-galaxy/"
repo_url = "https://github.com/greeddj/go-galaxy"
repo_name = "greeddj/go-galaxy"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Quick start" = "get-started/getting-started.md" },
    { "Coming from ansible-galaxy" = "get-started/ansible-galaxy-compat.md" },
  ]},
  { "Guides" = [
    "guides/requirements.md",
    "guides/lockfile.md",
    { "CI pipelines" = "guides/ci.md" },
    { "Servers and credentials" = "guides/servers-and-auth.md" },
    { "Caching and S3" = "guides/caching.md" },
    { "Signatures" = "guides/signatures.md" },
    "guides/security.md",
  ]},
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    "reference/configuration.md",
    "reference/exit-codes.md",
    "reference/metrics.md",
    "reference/upgrading.md",
    "reference/benchmarks.md",
  ]},
  { "Internals" = [
    { "How it works" = "internals/index.md" },
    { "Configuration loading" = "internals/config-loading.md" },
    { "Version solver" = "internals/solver.md" },
    { "Install pipeline" = "internals/install-pipeline.md" },
    { "Cache and storage" = "internals/cache.md" },
    { "Lockfile format" = "internals/lockfile-format.md" },
    { "HTTP, output and exit codes" = "internals/http-output-exit-codes.md" },
    { "Security boundaries" = "internals/boundaries.md" },
    { "Command flows" = [
      { "Entry and shared setup" = "internals/commands.md" },
      { "install" = "internals/flow-install.md" },
      { "lock" = "internals/flow-lock.md" },
      { "warm" = "internals/flow-warm.md" },
      { "cleanup" = "internals/flow-cleanup.md" },
      { "outdated" = "internals/flow-outdated.md" },
      { "hash, tree, explain" = "internals/flow-hash-tree-explain.md" },
    ]},
    { "Development" = "internals/development.md" },
  ]},
]
extra_css = ["assets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/greeddj/go-galaxy"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
"pymdownx.arithmatex".generic = true
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
"pymdownx.highlight".anchor_linenums = true
"pymdownx.highlight".line_spans = "__span"
"pymdownx.highlight".pygments_lang_class = true
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.quotes".callouts = true
"pymdownx.smartsymbols" = {}
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.tabbed".combine_header_slug = true
"pymdownx.tasklist".custom_checkbox = true
"pymdownx.tilde" = {}
