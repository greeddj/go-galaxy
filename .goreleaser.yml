version: 2

builds:
  - id: go-galaxy
    main: ./cmd/go-galaxy/main.go
    binary: go-galaxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}
      - -X main.BuiltBy=goreleaser

archives:
  - id: archive
    ids:
      - go-galaxy
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md
      - docs/*.md
  - id: binary
    ids:
      - go-galaxy
    formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

sboms:
  - id: binary
    artifacts: binary
  - id: archive
    artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Breaking changes'
      regexp: '^[[:alnum:]]+(\([^)]*\))?!:'
      order: 0
    - title: 'Features'
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: 'Bug fixes'
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: 'Others'
      order: 999

dockers_v2:
  - id: go-galaxy
    ids:
      - go-galaxy
    dockerfile: Dockerfile
    images:
      - "ghcr.io/greeddj/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

docker_signs:
  - cmd: cosign
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

homebrew_casks:
  - name: go-galaxy
    ids:
      - archive
    repository:
      owner: greeddj
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/greeddj/go-galaxy
    description: "Fast Ansible Galaxy collections and roles installer for CI."
    binaries:
      - go-galaxy
    skip_upload: auto
    caveats: |
      These builds are not Apple-notarized, so this cask clears the macOS
      quarantine attribute from the binary it installs. That skips a Gatekeeper
      check on your behalf. To verify the download instead, see
      https://github.com/greeddj/go-galaxy/blob/main/docs/security.md#verifying-a-release
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/go-galaxy"]
          end

release:
  github:
    owner: greeddj
    name: go-galaxy
  prerelease: auto
  header: |
    {{ .TagBody }}
