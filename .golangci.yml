version: "2"

linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - wrapcheck
    - varnamelen
    - tagliatelle
    - noinlineerr
    - nlreturn
    - nilerr
    - ireturn
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - testpackage
    - paralleltest
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - go/ast
            - go/parser
            - go/token
            - github.com/greeddj/go-galaxy
            - github.com/Masterminds/semver/v3
            - github.com/ProtonMail/go-crypto
            - github.com/go-git/go-git/v5
            - github.com/go-git/go-billy/v5
            - golang.org/x/crypto/ssh
            - github.com/klauspost/pgzip
            - github.com/psvmcc/hub
            - github.com/urfave/cli/v3
            - go.etcd.io/bbolt
            - go.yaml.in/yaml/v3
            - github.com/BurntSushi/toml
        # go-git and its billy filesystem reach production code through
        # gitfetch alone; fakegit builds the test remotes with them.
        go-git:
          files:
            - $all
            - "!$test"
            - "!**/internal/galaxy/gitfetch/**"
            - "!**/internal/testing/fakegit/**"
          deny:
            - pkg: github.com/go-git/go-git
              desc: only internal/galaxy/gitfetch may import go-git
            - pkg: github.com/go-git/go-billy
              desc: only internal/galaxy/gitfetch may import go-git
        # A concrete cache backend is chosen in internal/cache alone; the rest
        # codes to the Backend and ArtifactStore seam.
        cache-backends:
          files:
            - $all
            - "!$test"
            - "!**/internal/cache/cache.go"
          deny:
            - pkg: github.com/greeddj/go-galaxy/internal/cache/local
              desc: only internal/cache.New may name a concrete backend
            - pkg: github.com/greeddj/go-galaxy/internal/cache/s3
              desc: only internal/cache.New may name a concrete backend
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^tar\.NewWriter$
          pkg: ^archive/tar$
          msg: only internal/galaxy/treearchive writes tar archives
    goconst:
      exclude-types:
        - Call
        - CompositeLit
    lll:
      line-length: 140
    musttag:
      functions:
        - name: go.yaml.in/yaml/v3.Marshal
          tag: yaml
          arg-pos: 0
        - name: go.yaml.in/yaml/v3.Unmarshal
          tag: yaml
          arg-pos: 1
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      # Tests and the fakegalaxy double build fixture archives by hand.
      - path: (_test\.go$|internal/testing/|internal/galaxy/treearchive/)
        linters:
          - forbidigo
        text: tar\.NewWriter
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
